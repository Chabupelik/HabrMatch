version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: habr_swipe_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-habr_swipe}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-habr_swipe}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - common_net

  redis:
    image: redis:7-alpine
    container_name: habr_swipe_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - common_net

  rabbitmq:
    image: rabbitmq:3-alpine
    container_name: habr_swipe_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - common_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: habr_swipe_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - common_net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: habr_swipe_worker
    restart: unless-stopped
    env_file:
      - .env
    command: taskiq worker app.workers.broker:broker app.workers.tasks
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - common_net

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: habr_swipe_bot
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - common_net

volumes:
  pgdata:
  redis_data:
  rabbitmq_data:

networks:
  common_net:
    external: true
